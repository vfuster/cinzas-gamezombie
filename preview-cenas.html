<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinzas — teste das cenas</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/crt.css">
<link rel="stylesheet" href="css/situacao.css">
<link rel="stylesheet" href="css/cenas.css">
<style>
  body{ padding:14px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px; max-width:1200px; margin:0 auto; }
  h1{ font-family:'Bebas Neue', sans-serif; font-weight:400; letter-spacing:4px; text-align:center; color:var(--ink); }
  .card .viewport{ height:200px; }
  .card-name{ padding:6px 10px; font-size:11px; letter-spacing:2px; color:var(--ink-dim); border:1px solid rgba(201,196,168,.3); border-top:0; }
  .big{ max-width:760px; margin:0 auto 20px; }
  .big .viewport{ height:clamp(200px, 40vw, 300px); }
</style>
</head>
<body>
<h1>CINZAS — TESTE DAS CENAS</h1>
<div class="grid" id="grid"></div>
<script type="module">
import { sceneHTML } from './js/scenes.js';
const ICONS = ["mercado","floresta","abrigo_noturno","abrigo","radio","resgate","estrada","rivais","zumbis","desconhecido","escassez","ferido","final","trade","storm","loss","death"];
document.getElementById("grid").innerHTML = ICONS.map(i => `
  <div class="card scene">
    <div class="viewport">${sceneHTML(i)}<span class="vp-tag">${i.toUpperCase()}</span><span class="vp-rec">REC</span><i class="vp-vc a"></i><i class="vp-vc b"></i></div>
    <div class="card-name">${i}</div>
  </div>`).join("");
</script>
</body>
</html>
